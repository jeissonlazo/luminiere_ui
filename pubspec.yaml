# Lumiere's design system and component library.
#
# Standalone Flutter package: it does not know about the application, the
# editor, the viewport or the domain. Its only visual entry point is the tokens.
name: lumiere_ui
description: >-
  Lumiere's design system and component library: tokens, theme and accessible
  components derived from Arco, with no dependency on the application.
version: 0.4.0

repository: https://github.com/jeissonlazo/luminiere_ui
issue_tracker: https://github.com/jeissonlazo/luminiere_ui/issues

topics:
  - design-system
  - widgets
  - theming
  - ui

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
