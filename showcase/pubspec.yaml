# Visual documentation of `lumiere_ui`.
#
# This is not a product surface and it is not published: it is the gallery that
# validates the component package, in the shape of the documentation sites
# component libraries ship (a page per component, with live examples, the
# variant matrix and the API).
#
# It consumes the package the same way an application does, through its single
# public entry point, so anything the gallery can render is reachable by a
# consumer.
name: lumiere_ui_showcase
description: >-
  Visual documentation and component gallery of lumiere_ui: one page per
  component with live examples, states and the full API.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # Icons of the interface. The package is deliberately icon-agnostic: it
  # receives its icons from the application, and this gallery passes the same
  # set the product uses (decision E-2 of the pending list: Lucide, MIT).
  lucide_icons_flutter: ^3.1.24

  # The component package under documentation. Relative path so the gallery and
  # the package are checked out side by side:
  #
  #   <parent>/luminiere_ui/            <- the package
  #   <parent>/luminiere_ui/showcase/   <- this directory
  lumiere_ui:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # `Mark Pro` is the family the design system declares and the one
  # `ArcoType.fontFamily` names. It is NOT redistributed with the package: it is a
  # commercial typeface, so the library stays typeface-agnostic and every consumer
  # supplies its own licensed copy (see `specs/04-integration/consuming.md`).
  #
  # The gallery does bundle it, because a component gallery whose specimens render
  # in a fallback face documents nothing. The faces live in `fonts/MarkPro/`.
  #
  # THE WEIGHTS BELOW ARE NOT THE ONES THE FILES DECLARE. Each file carries a
  # weight of its own in its `OS/2` table - 250 Hairline, 275 Thin, 300 ExtraLight,
  # 350 Light, 400 Regular, 450 Book, 500 Medium, 700 Bold, 800 Heavy, 900 Black -
  # and Flutter accepts only the nine hundred steps, so ten cuts are pressed into
  # nine slots. The binding chosen:
  #
  #   100 Hairline      500 Medium
  #   200 ExtraLight    700 Bold
  #   300 Light         800 Heavy
  #   400 Book          900 Black
  #
  # Two consequences, deliberate and recorded as OPEN-26:
  #
  #  * No 600. The family has no semibold, so every `FontWeight.w600` in the type
  #    scale - which is every heading, per the design's own weight map - renders in
  #    Bold. Nothing is synthesized.
  #  * 400 is bound to Book (450), the family's reading weight, and not to the face
  #    named Regular (400), which is lighter than Book. `MarkPro.otf` and
  #    `MarkPro-Thin.otf` therefore ship but are not declared; bind 400 to
  #    `MarkPro.otf` instead if the design wants the lighter cut.
  fonts:
    - family: Mark Pro
      fonts:
        - asset: fonts/MarkPro/MarkPro-Hairline.otf
          weight: 100
        - asset: fonts/MarkPro/MarkPro-HairlineItalic.otf
          weight: 100
          style: italic
        - asset: fonts/MarkPro/MarkPro-ExtraLight.otf
          weight: 200
        - asset: fonts/MarkPro/MarkPro-ExtraLightItalic.otf
          weight: 200
          style: italic
        - asset: fonts/MarkPro/MarkPro-Light.otf
          weight: 300
        - asset: fonts/MarkPro/MarkPro-LightItalic.otf
          weight: 300
          style: italic
        - asset: fonts/MarkPro/MarkPro-Book.otf
          weight: 400
        - asset: fonts/MarkPro/MarkPro-BookItalic.otf
          weight: 400
          style: italic
        - asset: fonts/MarkPro/MarkPro-Medium.otf
          weight: 500
        - asset: fonts/MarkPro/MarkPro-MediumItalic.otf
          weight: 500
          style: italic
        - asset: fonts/MarkPro/MarkPro-Bold.otf
          weight: 700
        - asset: fonts/MarkPro/MarkPro-BoldItalic.otf
          weight: 700
          style: italic
        - asset: fonts/MarkPro/MarkPro-Heavy.otf
          weight: 800
        - asset: fonts/MarkPro/MarkPro-HeavyItalic.otf
          weight: 800
          style: italic
        - asset: fonts/MarkPro/MarkPro-Black.otf
          weight: 900
        - asset: fonts/MarkPro/MarkPro-BlackItalic.otf
          weight: 900
          style: italic
