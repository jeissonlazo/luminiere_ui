<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Served from a sub-path on GitHub Pages, so the base href has to start and
    end with a slash. `flutter build web --base-href` replaces this placeholder.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Component gallery and visual documentation of lumiere_ui, the Lumiere design system.">
  <meta name="color-scheme" content="dark light">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>lumiere_ui - component gallery</title>

  <style>
    /* Painted before Flutter boots, so the first frame does not flash white
       against the dark theme the gallery opens in. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #17171a;
    }

    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: #78787a;
      transition: opacity 240ms ease;
    }
  </style>
</head>
<body>
  <div id="boot">Loading lumiere_ui&hellip;</div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
