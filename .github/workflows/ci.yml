name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      # Goldens depend on the operating system's rasterisation and their
      # baseline is generated on Windows. On a Linux runner they do not match,
      # so they are excluded. They are regenerated and validated locally with
      # `flutter test --update-goldens`.
      - name: Tests (without goldens)
        run: flutter test --exclude-tags=golden

      - name: Publish check
        run: flutter pub publish --dry-run
